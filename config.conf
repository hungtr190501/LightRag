server {
    location / {
        add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://192.168.2.210:8502;
    }

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE';
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;  # Thêm header này
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
        proxy_pass http://192.168.2.210:5055;
    }

    server_name  tracuuluat.phuongbinhtay.com;



    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tracuuluat.phuongbinhtay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tracuuluat.phuongbinhtay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tracuuluat.phuongbinhtay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    server_name  tracuuluat.phuongbinhtay.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}

